name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tlsca-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Add GameShowPro package source
        shell: pwsh
        env:
          PREFERRED_USERNAME: ${{ vars.GSP_PACKAGE_USERNAME }}
          PREFERRED_PAT: ${{ secrets.GSP_PACKAGE_PAT }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_URL: ${{ vars.NUGET_URL }}
        run: |
          if (-not $env:PACKAGE_URL) { throw 'NUGET_URL must be configured for package restore.' }
          $username = if ($env:PREFERRED_PAT -and $env:PREFERRED_USERNAME) { $env:PREFERRED_USERNAME } else { $env:ACTOR }
          $token = if ($env:PREFERRED_PAT) { $env:PREFERRED_PAT } else { $env:GITHUB_TOKEN }
          if (-not $username -or -not $token) { throw 'No GameShowPro package source credential is available.' }
          dotnet nuget add source $env:PACKAGE_URL --name github --username $username --password $token --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the GameShowPro package source.' }
      - name: Restore against published dependencies
        shell: pwsh
        run: |
          dotnet restore TlsCa.slnx -p:UseMdnsProject=false
          if ($LASTEXITCODE -ne 0) { throw 'Package restore failed.' }
      - name: Run Release tests with warnings as errors
        shell: pwsh
        run: |
          dotnet test TlsCa.slnx --no-restore -c Release -p:UseMdnsProject=false -p:TreatWarningsAsErrors=true --logger trx
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Check packaged guide examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MkDocs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet mkdocs-material
      - name: Render and build examples
        run: .venv/bin/python docs/check_examples.py
      - name: Check management page behavior
        run: node tests/management-page.test.cjs

  package:
    name: Pack and inspect
    needs: [test, docs]
    runs-on: ubuntu-latest
    outputs:
      semver2: ${{ steps.version.outputs.semver2 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Calculate package version
        uses: dotnet/nbgv@v0.5.2
        with:
          setAllVars: true
      - name: Export release version
        id: version
        shell: pwsh
        run: |
          if (-not $env:NBGV_SemVer2) { throw 'Nerdbank.GitVersioning did not provide a version.' }
          "semver2=$env:NBGV_SemVer2" >> $env:GITHUB_OUTPUT
      - name: Add GameShowPro package source
        shell: pwsh
        env:
          PREFERRED_USERNAME: ${{ vars.GSP_PACKAGE_USERNAME }}
          PREFERRED_PAT: ${{ secrets.GSP_PACKAGE_PAT }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_URL: ${{ vars.NUGET_URL }}
        run: |
          if (-not $env:PACKAGE_URL) { throw 'NUGET_URL must be configured for package restore.' }
          $username = if ($env:PREFERRED_PAT -and $env:PREFERRED_USERNAME) { $env:PREFERRED_USERNAME } else { $env:ACTOR }
          $token = if ($env:PREFERRED_PAT) { $env:PREFERRED_PAT } else { $env:GITHUB_TOKEN }
          if (-not $username -or -not $token) { throw 'No GameShowPro package source credential is available.' }
          dotnet nuget add source $env:PACKAGE_URL --name github --username $username --password $token --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the GameShowPro package source.' }
      - name: Pack against published dependencies
        shell: pwsh
        run: |
          dotnet pack src/GameshowPro.TlsCa/GameshowPro.TlsCa.csproj -c Release -o publish -p:UseMdnsProject=false -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed.' }
      - name: Inspect package contents and dependency
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem publish -Filter 'GameshowPro.TlsCa.*.nupkg' -File)
          $symbols = @(Get-ChildItem publish -Filter 'GameshowPro.TlsCa.*.snupkg' -File)
          if ($packages.Count -ne 1 -or $symbols.Count -ne 1) { throw 'Expected exactly one NuGet package and one symbol package.' }
          [xml]$project = Get-Content src/GameshowPro.TlsCa/GameshowPro.TlsCa.csproj
          $mdnsVersion = $project.SelectSingleNode('/Project/PropertyGroup/MdnsPackageVersion').InnerText
          if (-not $mdnsVersion) { throw 'MdnsPackageVersion must name a published GameshowPro.Mdns package.' }
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            $expected = @(
              'readme.md',
              'docs/https-guide.md',
              'docs/render_https_guide.py',
              'docs/integrating-the-https-guide.md',
              'docs/examples/soundling.md',
              'docs/examples/triggergate.yaml',
              'lib/net11.0/GameshowPro.TlsCa.dll'
            )
            $missing = @($expected | Where-Object { $entries -notcontains $_ })
            if ($missing.Count -gt 0) { throw "Package is missing: $($missing -join ', ')" }
            $nuspecEntry = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one NuGet manifest.' }
            $reader = [System.IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $dependency = @($nuspec.package.metadata.dependencies.group.dependency | Where-Object { $_.id -eq 'GameshowPro.Mdns' })
            $allowedVersions = @($mdnsVersion, "[$mdnsVersion, )", "[$mdnsVersion,)")
            if ($dependency.Count -ne 1 -or $dependency[0].version -notin $allowedVersions) {
              throw "Expected GameshowPro.Mdns dependency version $mdnsVersion in the NuGet manifest."
            }
          }
          finally { $archive.Dispose() }
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            publish/*.nupkg
            publish/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package and release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ./publish
      - name: Install versioning tool
        uses: dotnet/nbgv@v0.5.2
      - name: Publish to GameShowPro package source
        shell: pwsh
        env:
          PACKAGE_URL: ${{ vars.NUGET_URL }}
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:PACKAGE_URL) { throw 'NUGET_URL must be configured for package publishing.' }
          $packages = @(Get-ChildItem publish -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one package to publish.' }
          dotnet nuget push $packages[0].FullName --api-key $env:PACKAGE_TOKEN --source $env:PACKAGE_URL --skip-duplicate --no-symbols
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $($packages[0].Name)." }
      - name: Tag published version
        shell: pwsh
        env:
          SEMVER2: ${{ needs.package.outputs.semver2 }}
        run: |
          if (-not $env:SEMVER2) { throw 'Package version is unavailable.' }
          nbgv tag $env:SEMVER2
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create version tag.' }
          git push origin "v$env:SEMVER2"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push version tag.' }
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.package.outputs.semver2 }}
          files: |
            publish/*.nupkg
            publish/*.snupkg
          fail_on_unmatched_files: true
